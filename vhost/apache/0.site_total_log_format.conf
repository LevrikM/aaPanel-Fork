<IfModule !logio_module>
    LoadModule logio_module modules/mod_logio.so
</IfModule>

LogFormat '{\
"server_addr": "%A",\
"server_port": %{local}p,\
"host": "%{Host}i",\
"x_forwarded_for": "%{X-Forwarded-For}i",\
"x_real_ip": "%{X-Real-IP}i",\
"x_forwarded": "%{X-Forwarded}i",\
"forwarded_for": "%{Forwarded-For}i",\
"forwarded": "%{Forwarded}i",\
"true_client_ip": "%{True-Client-IP}i",\
"client_ip": "%{Client-IP}i",\
"ali_cdn_real_ip": "%{Ali-CDN-Real-IP}i",\
"cdn_src_ip": "%{CDN-Src-Ip}i",\
"cdn_real_ip": "%{CDN-Real-Ip}i",\
"cf_connecting_ip": "%{CF-Connecting-IP}i",\
"x_cluster_client_ip": "%{X-Cluster-Client-IP}i",\
"wl_proxy_client_ip": "%{WL-Proxy-Client-IP}i",\
"proxy_client_ip": "%{Proxy-Client-IP}i",\
"remote_addr": "%a",\
"remote_port": %{remote}p,\
"remote_user": "%u",\
"https": "%{HTTPS}x",\
"req_length": %I,\
"method": "%m",\
"request": "%r",\
"request_filename": "%f",\
"status": %s,\
"sent_bytes": %O,\
"body_bytes_sent": %b,\
"user_agent": "%{User-Agent}i",\
"content_type": "%{Content-Type}o",\
"cookie": "%{Cookie}i",\
"accept": "%{Accept}i",\
"accept_language": "%{Accept-Language}i",\
"accept_encoding": "%{Accept-Encoding}i"\
}' site_total